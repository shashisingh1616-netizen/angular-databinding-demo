<h2>Display TypeScript Data into HTML (Interpolation)</h2>
<p>User Name: {{userName}}</p>
<p>First Name: {{firstName}}</p>
<p>Last Name: {{lastName}}</p>
<p>Email: {{email}}</p>

<hr>

<h2>Property Binding</h2>
<button [disabled]="flag">Status Button</button>

<hr>

<h2>Event Binding</h2>
<input type="text" placeholder="Enter course name" #myinput>
<button (click)="updateCourse(myinput.value)">Class Status</button>
<p>Status: {{classStatus}}</p>

<hr>

<h2>Two-Way Data Binding</h2>
<input type="text" placeholder="Enter Guest Name" [(ngModel)]="guestName">
<p>You have entered guest name is: {{guestName}}</p>
